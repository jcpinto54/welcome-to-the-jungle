<!doctype html>
<meta charset="utf-8">
<title>World viewer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js"></script>
<script src="../src/core.js"></script>
<script src="../src/textures.js"></script>
<script src="../src/world.js"></script>
<script src="../src/render.js"></script>
<script>
// Dev tool: renders the world from a camera given in the URL hash: #x,y,z,lookX,lookY,lookZ,sat
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2b1b4d, 18, 95);
const camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.1, 900);
Render.init(document.getElementById('c'));
const t0 = performance.now();
World.build(scene);
window.buildMs = performance.now() - t0;
window.view = (x, y, z, lx, ly, lz, sat = 1) => {
  camera.position.set(x, y, z); camera.lookAt(lx, ly, lz);
  Render.U.sat.value = sat; Render.resize(camera);
  World.update(1, 0.016, 0.5); Render.draw(scene, camera);
};
const v = (location.hash.slice(1) || '-60,6,52,-74,6,70,1').split(',').map(Number);
view(...v);
window.addEventListener('resize', () => view(...v));
</script>
